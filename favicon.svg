<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="grad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Circle -->
  <circle cx="50" cy="50" r="46" fill="#0b1120" stroke="#0d9488" stroke-width="2.5" />
  
  <!-- DNA Strands with nodes -->
  <!-- Rungs / Base pairs -->
  <line x1="30" y1="28" x2="70" y2="28" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
  <line x1="34" y1="38" x2="66" y2="38" stroke="#14b8a6" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
  <line x1="42" y1="50" x2="58" y2="50" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
  <line x1="34" y1="62" x2="66" y2="62" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
  <line x1="30" y1="72" x2="70" y2="72" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
  
  <!-- Helix Strand 1 -->
  <path d="M 30 25 C 28 35, 45 45, 50 50 C 55 55, 72 65, 70 75" fill="none" stroke="url(#grad1)" stroke-width="4.5" stroke-linecap="round" filter="url(#glow)" />
  
  <!-- Helix Strand 2 -->
  <path d="M 70 25 C 72 35, 55 45, 50 50 C 45 55, 28 65, 30 75" fill="none" stroke="url(#grad2)" stroke-width="4.5" stroke-linecap="round" filter="url(#glow)" />
  
  <!-- Nucleotide Nodes -->
  <circle cx="30" cy="28" r="4" fill="#06b6d4" />
  <circle cx="70" cy="28" r="4" fill="#818cf8" />
  <circle cx="34" cy="38" r="3.5" fill="#14b8a6" />
  <circle cx="66" cy="38" r="3.5" fill="#38bdf8" />
  <circle cx="50" cy="50" r="4.5" fill="#22d3ee" filter="url(#glow)" />
  <circle cx="34" cy="62" r="3.5" fill="#10b981" />
  <circle cx="66" cy="62" r="3.5" fill="#14b8a6" />
  <circle cx="30" cy="72" r="4" fill="#06b6d4" />
  <circle cx="70" cy="72" r="4" fill="#818cf8" />
</svg>