name: Android preview build
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'src/**'
      - 'shared/**'
      - 'public/**'
      - 'package*.json'
      - 'capacitor.config.ts'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm test
      - run: npm run check:function
      - run: npm run android:sync
      - name: Compile APK and unsigned bundle with preinstalled SDK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug bundleRelease lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: arif-bio-hub-android-preview
          if-no-files-found: error
          retention-days: 30
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/reports/lint-results-debug.html
